<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cash Out | CashTitan</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

<!-- MONETAG SDK -->
<script src='//libtl.com/sdk.js' data-zone='11094140' data-sdk='show_11094140'></script>
<style>
:root {
  --bg:#f5f0e8; --gold:#FFD600; --cyan:#00D1FF; --pink:#FF66B2;
  --purple:#A29BFE; --orange:#FF9F43; --green:#00E676;
  --dark:#000; --border:3px solid #000; --shadow:5px 5px 0px #000;
  --shadow-sm:3px 3px 0px #000; --radius:18px; --white:#FFFFFF;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--dark); min-height:100vh; padding:16px 16px 90px; }

.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.page-title { font-size:1.4rem; font-weight:900; }

.balance-card {
  background:linear-gradient(135deg,var(--cyan),#0088ff);
  border:var(--border); box-shadow:var(--shadow);
  border-radius:var(--radius); padding:20px; margin-bottom:18px; position:relative; overflow:hidden;
}
.balance-card::before { content:'💳'; position:absolute; right:-5px; top:-5px; font-size:70px; opacity:0.15; }
.bal-label { font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:2px; color:rgba(0,0,0,0.6); }
.bal-amount { font-size:2.8rem; font-weight:900; color:var(--dark); margin:4px 0; }

/* WITHDRAW FORM */
.withdraw-form {
  background:var(--white); border:var(--border); box-shadow:var(--shadow);
  border-radius:var(--radius); padding:20px; margin-bottom:18px;
}
.form-title { font-size:1rem; font-weight:900; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.form-label { font-size:0.78rem; font-weight:900; text-transform:uppercase; margin-bottom:6px; display:block; }
.form-input {
  width:100%; padding:12px 14px; border:var(--border); border-radius:12px;
  font-family:'Outfit',sans-serif; font-size:0.95rem; font-weight:700;
  background:#fafafa; margin-bottom:14px; outline:none;
}
.form-input:focus { border-color:#0088ff; background:var(--white); }
.amount-presets { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
.preset-btn {
  padding:10px 0; background:var(--white); border:var(--border);
  box-shadow:var(--shadow-sm); border-radius:10px; font-family:'Outfit',sans-serif;
  font-weight:900; font-size:0.82rem; cursor:pointer;
  transition:transform 0.1s, box-shadow 0.1s, background 0.1s;
}
.preset-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0px #000; }
.preset-btn.selected { background:var(--gold); }

.submit-withdraw-btn {
  width:100%; padding:16px; background:var(--pink); border:var(--border);
  box-shadow:var(--shadow); border-radius:14px; font-family:'Outfit',sans-serif;
  font-weight:900; font-size:1.1rem; cursor:pointer; color:var(--dark);
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform 0.1s, box-shadow 0.1s;
}
.submit-withdraw-btn:active { transform:translate(3px,3px); box-shadow:2px 2px 0px #000; }

/* METHOD TABS */
.method-tabs { display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; }
.method-tab {
  padding:8px 16px; border:var(--border); border-radius:30px;
  font-family:'Outfit',sans-serif; font-weight:900; font-size:0.82rem;
  cursor:pointer; white-space:nowrap; background:var(--white);
  transition:background 0.15s; box-shadow:var(--shadow-sm);
}
.method-tab.active { background:var(--gold); }

/* HISTORY */
.history-section { background:var(--white); border:var(--border); box-shadow:var(--shadow); border-radius:var(--radius); padding:16px; }
.section-title { font-size:1rem; font-weight:900; margin-bottom:12px; }
.w-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px; border:2px solid #eee; border-radius:12px; margin-bottom:8px;
}
.w-left { display:flex; align-items:center; gap:10px; }
.w-icon { width:40px; height:40px; border-radius:12px; border:2px solid #000; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.w-info h4 { font-size:0.88rem; font-weight:800; margin-bottom:2px; }
.w-info span { font-size:0.72rem; color:#888; font-weight:600; }
.w-right { text-align:right; }
.w-amount { font-size:0.95rem; font-weight:900; display:block; }
.w-status { font-size:0.7rem; font-weight:900; padding:3px 10px; border-radius:20px; border:2px solid #000; display:inline-block; margin-top:3px; }
.s-pending { background:var(--orange); }
.s-paid { background:var(--green); }
.s-rejected { background:var(--pink); }

/* BOTTOM NAV */
.bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:1000; background:var(--white); border-top:var(--border); display:flex; align-items:stretch; box-shadow:0 -3px 0 #000; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 4px; gap:3px; cursor:pointer; border:none; background:transparent; font-family:'Outfit',sans-serif; color:#888; font-size:0.6rem; font-weight:800; text-transform:uppercase; text-decoration:none; border-right:2px solid #000; }
.nav-item:last-child { border-right:none; }
.nav-item i{font-size:20px;}
.nav-item.active{background:var(--gold);color:var(--dark);}
.nav-item:active{background:var(--gold);}
</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="header">
  <div class="page-title">💳 Cash Out</div>
</div>

<div class="balance-card">
  <div class="bal-label">💰 Available Balance</div>
  <div class="bal-amount" id="balanceDisplay">$0.00</div>
</div>

<!-- METHOD TABS -->
<div class="method-tabs">
  <button class="method-tab active" onclick="selectMethod('binance',this)">🟡 Binance</button>
  <button class="method-tab" onclick="selectMethod('faucetpay',this)">🚰 FaucetPay</button>
  <button class="method-tab" onclick="selectMethod('crypto',this)">₿ Crypto</button>
</div>

<!-- BINANCE FORM -->
<div class="withdraw-form" id="form-binance">
  <div class="form-title">🟡 Binance Withdraw</div>
  <label class="form-label">Binance ID / UID</label>
  <input class="form-input" type="text" id="binanceId" placeholder="e.g. 123456789">
  <label class="form-label">Binance Email</label>
  <input class="form-input" type="email" id="binanceEmail" placeholder="your@email.com">
  <label class="form-label">Amount (USD) — Min $5</label>
  <input class="form-input" type="number" id="binanceAmount" placeholder="5.00" min="5">
  <div class="amount-presets">
    <button class="preset-btn" onclick="setAmount(5,this)">$5</button>
    <button class="preset-btn" onclick="setAmount(10,this)">$10</button>
    <button class="preset-btn" onclick="setAmount(25,this)">$25</button>
    <button class="preset-btn" onclick="setAmountMax(this)">MAX</button>
  </div>
  <button class="submit-withdraw-btn" onclick="submitWithdraw('binance')">⚡ REQUEST WITHDRAW</button>
</div>

<!-- FAUCETPAY FORM -->
<div class="withdraw-form" id="form-faucetpay" style="display:none">
  <div class="form-title">🚰 FaucetPay Withdraw</div>
  <label class="form-label">FaucetPay Email</label>
  <input class="form-input" type="email" id="faucetEmail" placeholder="your@faucetpay.io">
  <label class="form-label">Amount (USD) — Min $5</label>
  <input class="form-input" type="number" id="faucetAmount" placeholder="5.00" min="5">
  <button class="submit-withdraw-btn" onclick="submitWithdraw('faucetpay')">⚡ REQUEST WITHDRAW</button>
</div>

<!-- CRYPTO FORM -->
<div class="withdraw-form" id="form-crypto" style="display:none">
  <div class="form-title">₿ Crypto Withdraw</div>
  <label class="form-label">Wallet Address</label>
  <input class="form-input" type="text" id="cryptoAddress" placeholder="Your crypto wallet address">
  <label class="form-label">Network / Coin</label>
  <input class="form-input" type="text" id="cryptoCoin" placeholder="e.g. USDT TRC20">
  <label class="form-label">Amount (USD) — Min $5</label>
  <input class="form-input" type="number" id="cryptoAmount" placeholder="5.00" min="5">
  <button class="submit-withdraw-btn" onclick="submitWithdraw('crypto')">⚡ REQUEST WITHDRAW</button>
</div>

<!-- VIEW HISTORY BUTTON -->
<div style="margin-bottom:16px">
  <button onclick="toggleHistory()" style="width:100%;padding:12px;background:var(--cyan);border:var(--border);box-shadow:var(--shadow-sm);border-radius:14px;font-family:'Outfit',sans-serif;font-weight:900;font-size:0.95rem;cursor:pointer;">⏱ View Withdraw History</button>
</div>

<div class="history-section" id="historySection" style="display:none">
  <div class="section-title">📜 Withdraw History</div>
  <div id="withdrawHistory"><div style="text-align:center;padding:16px;font-weight:700;color:#888">Loading...</div></div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="dashboard.html"><i class="fas fa-home"></i>HOME</a>
  <a class="nav-item" href="quiz.html"><i class="fas fa-brain"></i>QUIZ</a>
  <a class="nav-item" href="tasks.html"><i class="fas fa-tasks"></i>TASKS</a>
  <a class="nav-item" href="spin.html"><i class="fas fa-sync-alt"></i>SPIN</a>
  <a class="nav-item" href="refer.html"><i class="fas fa-user-plus"></i>REFER</a>
  <a class="nav-item active" href="withdrawals.html"><i class="fas fa-wallet"></i>CASH</a>
</nav>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
let tg;try{tg=window.Telegram.WebApp;tg.expand();}catch(e){tg=null;}

// MONETAG — Auto Interstitial har 60 sec
function showMonetagAd(callback){
  if(typeof show_11094140==='function'){
    show_11094140().then(()=>{if(callback)callback();}).catch(()=>{if(callback)callback();});
  } else { if(callback)callback(); }
}
setInterval(()=>{ showMonetagAd(); }, 60000);
let user=tg?.initDataUnsafe?.user||{id:localStorage.getItem("app_user_id")||0};
const API="";
let userBalance=0; let historyLoaded=false;

function selectMethod(method,btn){
  document.querySelectorAll('.method-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('[id^="form-"]').forEach(f=>f.style.display='none');
  document.getElementById('form-'+method).style.display='block';
}

function setAmount(val,btn){
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('binanceAmount').value=val;
}
function setAmountMax(btn){
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('binanceAmount').value=userBalance.toFixed(2);
}

async function loadBalance(){
  try{
    const res=await fetch(`${API}/api/user_balance/${user.id}`);
    const data=await res.json();
    if(data.success){ userBalance=parseFloat(data.user.total_usd)||0; document.getElementById('balanceDisplay').textContent='$'+userBalance.toFixed(2); }
  }catch(e){}
}

async function submitWithdraw(method){
  let account='',amount=0;
  if(method==='binance'){
    const id=document.getElementById('binanceId').value.trim();
    const email=document.getElementById('binanceEmail').value.trim();
    amount=parseFloat(document.getElementById('binanceAmount').value)||0;
    if(!id||!email){alert('Please fill all fields!');return;}
    if(amount<5){alert('Minimum withdraw is $5');return;}
    account=`${id} / ${email}`;
  } else if(method==='faucetpay'){
    account=document.getElementById('faucetEmail').value.trim();
    amount=parseFloat(document.getElementById('faucetAmount').value)||0;
    if(!account){alert('Enter FaucetPay email!');return;}
    if(amount<5){alert('Minimum withdraw is $5');return;}
  } else if(method==='crypto'){
    const addr=document.getElementById('cryptoAddress').value.trim();
    const coin=document.getElementById('cryptoCoin').value.trim();
    amount=parseFloat(document.getElementById('cryptoAmount').value)||0;
    if(!addr||!coin){alert('Please fill all fields!');return;}
    if(amount<5){alert('Minimum withdraw is $5');return;}
    account=`${addr} (${coin})`;
  }
  if(amount>userBalance){alert(`Insufficient balance! Your balance: $${userBalance.toFixed(2)}`);return;}
  if(!confirm(`Request withdraw of $${amount.toFixed(2)} via ${method}?`))return;
  try{
    const res=await fetch(`${API}/api/withdraw`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_id:user.id,amount,method,account})});
    const data=await res.json();
    if(data.success){alert('🎉 Withdraw requested! Admin will review within 24h.');loadBalance();}
    else{alert(data.message||'Error submitting withdraw');}
  }catch(e){alert('Network error. Try again.');}
}

function toggleHistory(){
  const el=document.getElementById('historySection');
  if(el.style.display==='none'){el.style.display='block';if(!historyLoaded){loadHistory();historyLoaded=true;}}
  else el.style.display='none';
}

async function loadHistory(){
  const el=document.getElementById('withdrawHistory');
  try{
    const res=await fetch(`${API}/api/withdrawals/${user.id}`);
    const data=await res.json();
    if(!data.success||!data.withdrawals?.length){el.innerHTML='<div style="text-align:center;padding:16px;font-weight:700;color:#888">No withdrawals yet.</div>';return;}
    const statusColors={pending:'s-pending',paid:'s-paid',rejected:'s-rejected'};
    const statusIcons={pending:'⏳',paid:'✅',rejected:'❌'};
    el.innerHTML=data.withdrawals.map(w=>`
      <div class="w-item">
        <div class="w-left">
          <div class="w-icon" style="background:var(--gold)">${statusIcons[w.status]||'⏳'}</div>
          <div class="w-info"><h4>${w.method||'Binance'}</h4><span>${new Date(w.created_at).toLocaleDateString()}</span></div>
        </div>
        <div class="w-right">
          <span class="w-amount">$${parseFloat(w.amount).toFixed(2)}</span>
          <span class="w-status ${statusColors[w.status]||'s-pending'}">${(w.status||'pending').toUpperCase()}</span>
        </div>
      </div>`).join('');
  }catch(e){el.innerHTML='<div style="color:#f66;text-align:center;font-weight:700">Error loading</div>';}
}

loadBalance();
</script>
</body>
</html>
