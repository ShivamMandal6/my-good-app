<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Withdrawal Status | CashTitan</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root{--bg:#F5F0E8;--white:#fff;--dark:#000;--gold:#FFD600;--cyan:#00D1FF;--pink:#FF66B2;--purple:#A29BFE;--orange:#FF9F43;--green:#00E676;--border:3px solid #000;--shadow:5px 5px 0px #000;--shadow-sm:3px 3px 0px #000;--radius:16px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--dark);padding:16px 16px 90px;min-height:100vh;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.page-title{font-size:1.4rem;font-weight:900;}
.back-btn{background:var(--white);border:var(--border);box-shadow:var(--shadow-sm);padding:8px 14px;border-radius:10px;font-family:'Outfit',sans-serif;font-weight:900;font-size:0.88rem;cursor:pointer;text-decoration:none;color:var(--dark);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.stat-card{border:var(--border);box-shadow:var(--shadow-sm);border-radius:var(--radius);padding:16px;text-align:center;}
.stat-val{font-size:1.8rem;font-weight:900;}
.stat-lbl{font-size:0.72rem;font-weight:800;text-transform:uppercase;color:#555;}
.w-item{background:var(--white);border:var(--border);box-shadow:var(--shadow-sm);border-radius:var(--radius);padding:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.w-icon{width:44px;height:44px;border-radius:12px;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;margin-right:12px;}
.w-amount{font-size:1rem;font-weight:900;}
.w-date{font-size:0.72rem;color:#888;font-weight:600;}
.w-status{padding:4px 12px;border-radius:20px;border:2px solid #000;font-size:0.72rem;font-weight:900;text-transform:uppercase;}
.s-pending{background:var(--orange);}
.s-paid{background:var(--green);}
.s-rejected{background:var(--pink);}
.section-title{font-size:1rem;font-weight:900;margin-bottom:12px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:var(--white);border-top:var(--border);display:flex;align-items:stretch;box-shadow:0 -3px 0 #000;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;gap:3px;border:none;background:transparent;font-family:'Outfit',sans-serif;color:#888;font-size:0.6rem;font-weight:800;text-transform:uppercase;text-decoration:none;border-right:2px solid #000;}
.nav-item:last-child{border-right:none;}
.nav-item i{font-size:20px;}
.nav-item.active{background:var(--gold);color:var(--dark);}
</style>
</head>
<body>
<div class="header">
  <a class="back-btn" href="withdrawals.html"><i class="fas fa-arrow-left"></i></a>
  <div class="page-title">📊 Withdraw Status</div>
  <div style="width:44px"></div>
</div>

<div class="stats-grid">
  <div class="stat-card" style="background:var(--cyan);">
    <div class="stat-val" id="totalWithdrawn">$0.00</div>
    <div class="stat-lbl">Total Requested</div>
  </div>
  <div class="stat-card" style="background:var(--green);">
    <div class="stat-val" id="totalPaid">$0.00</div>
    <div class="stat-lbl">Total Paid</div>
  </div>
  <div class="stat-card" style="background:var(--orange);">
    <div class="stat-val" id="totalPending">0</div>
    <div class="stat-lbl">Pending</div>
  </div>
  <div class="stat-card" style="background:var(--pink);">
    <div class="stat-val" id="totalRejected">0</div>
    <div class="stat-lbl">Rejected</div>
  </div>
</div>

<div class="section-title">📜 All Withdrawals</div>
<div id="withdrawList"><div style="text-align:center;padding:20px;font-weight:700;color:#888">Loading...</div></div>

<nav class="bottom-nav">
  <a class="nav-item" href="dashboard.html"><i class="fas fa-home"></i>HOME</a>
  <a class="nav-item" href="quiz.html"><i class="fas fa-brain"></i>QUIZ</a>
  <a class="nav-item" href="tasks.html"><i class="fas fa-tasks"></i>TASKS</a>
  <a class="nav-item" href="spin.html"><i class="fas fa-sync-alt"></i>SPIN</a>
  <a class="nav-item" href="refer.html"><i class="fas fa-user-plus"></i>REFER</a>
  <a class="nav-item active" href="withdrawals.html"><i class="fas fa-wallet"></i>CASH</a>
</nav>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
let tg;try{tg=window.Telegram.WebApp;tg.expand();}catch(e){}
let user=tg?.initDataUnsafe?.user||{id:localStorage.getItem("cz_uid")||0};

async function load(){
  try{
    const res=await fetch("/api/withdrawals/"+user.id);
    const data=await res.json();
    const el=document.getElementById("withdrawList");
    if(!data.success||!data.withdrawals?.length){el.innerHTML='<div style="text-align:center;padding:20px;font-weight:700;color:#888">No withdrawals yet.</div>';return;}
    const ws=data.withdrawals;
    document.getElementById("totalWithdrawn").textContent="$"+ws.reduce((s,w)=>s+parseFloat(w.amount),0).toFixed(2);
    document.getElementById("totalPaid").textContent="$"+ws.filter(w=>w.status==='paid').reduce((s,w)=>s+parseFloat(w.amount),0).toFixed(2);
    document.getElementById("totalPending").textContent=ws.filter(w=>w.status==='pending').length;
    document.getElementById("totalRejected").textContent=ws.filter(w=>w.status==='rejected').length;
    const icons={pending:'⏳',paid:'✅',rejected:'❌'};
    const colors={pending:'var(--orange)',paid:'var(--green)',rejected:'var(--pink)'};
    el.innerHTML=ws.map(w=>`
      <div class="w-item">
        <div class="w-icon" style="background:${colors[w.status]||'var(--orange)'}">${icons[w.status]||'⏳'}</div>
        <div style="flex:1"><div class="w-amount">$${parseFloat(w.amount).toFixed(2)}</div><div class="w-date">${w.method||'Binance'} · ${new Date(w.created_at).toLocaleDateString()}</div></div>
        <span class="w-status s-${w.status}">${w.status.toUpperCase()}</span>
      </div>`).join('');
  }catch(e){}
}
load();
</script>
</body>
</html>
