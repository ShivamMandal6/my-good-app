<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CashTitan | Quiz Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<!-- MONETAG SDK -->
<script src='//libtl.com/sdk.js' data-zone='11094140' data-sdk='show_11094140'></script>
<style>
:root{
  --bg:#F5F0E8;--white:#FFFFFF;--dark:#000000;
  --gold:#FFD600;--cyan:#00D1FF;--pink:#FF66B2;
  --purple:#A29BFE;--orange:#FF9F43;--green:#00E676;--red:#FF4757;
  --border:3px solid #000;--shadow:5px 5px 0px #000;--shadow-sm:3px 3px 0px #000;--radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:var(--bg);font-family:'Outfit',sans-serif;color:var(--dark);padding:14px 14px 90px;min-height:100vh;}

/* HEADER */
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.app-logo{font-size:1.3rem;font-weight:900;background:#000;color:var(--gold);border:var(--border);box-shadow:var(--shadow-sm);padding:7px 16px;border-radius:12px;letter-spacing:-0.5px;display:flex;align-items:center;gap:6px;}
.app-logo .accent{color:var(--cyan);}
.coins-chip{background:#000;color:var(--gold);border:var(--border);box-shadow:var(--shadow-sm);padding:6px 14px;border-radius:30px;font-weight:900;font-size:0.9rem;display:flex;align-items:center;gap:6px;}

/* QUIZ LIST */
.page-title{font-size:1.1rem;font-weight:900;margin-bottom:14px;}
.quiz-search{width:100%;padding:11px 14px;border:var(--border);border-radius:12px;font-family:'Outfit',sans-serif;font-size:0.92rem;font-weight:700;background:var(--white);outline:none;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.quiz-count{font-size:0.78rem;font-weight:800;color:#888;text-transform:uppercase;margin-bottom:12px;}
.quiz-card{background:var(--white);border:var(--border);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px;margin-bottom:12px;cursor:pointer;transition:transform .1s,box-shadow .1s;}
.quiz-card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000;}
.quiz-card-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.quiz-icon{width:48px;height:48px;border-radius:12px;border:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;background:var(--bg);}
.quiz-title{font-weight:900;font-size:0.95rem;margin-bottom:3px;}
.quiz-meta{font-size:0.72rem;font-weight:700;color:#888;}
.quiz-card-footer{display:flex;align-items:center;justify-content:space-between;}
.quiz-reward{background:var(--gold);border:2px solid #000;border-radius:20px;padding:4px 12px;font-size:0.75rem;font-weight:900;display:inline-flex;align-items:center;gap:4px;}
.quiz-play-btn{background:var(--green);border:var(--border);box-shadow:var(--shadow-sm);padding:8px 18px;border-radius:10px;font-family:'Outfit',sans-serif;font-weight:900;font-size:0.82rem;cursor:pointer;transition:transform .1s,box-shadow .1s;}
.quiz-play-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
.load-more-btn{width:100%;padding:13px;background:var(--white);border:var(--border);box-shadow:var(--shadow-sm);border-radius:12px;font-family:'Outfit',sans-serif;font-weight:900;font-size:0.9rem;cursor:pointer;margin-top:8px;}

/* GAME SCREEN */
#gameScreen{display:none;}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;}
.back-btn{background:var(--white);border:var(--border);box-shadow:var(--shadow-sm);padding:8px 14px;border-radius:10px;font-family:'Outfit',sans-serif;font-weight:900;font-size:0.88rem;cursor:pointer;}
.q-pts{background:var(--gold);border:var(--border);box-shadow:var(--shadow-sm);padding:6px 14px;border-radius:30px;font-weight:900;font-size:0.85rem;}
.q-usd{background:var(--green);border:var(--border);box-shadow:var(--shadow-sm);padding:6px 14px;border-radius:30px;font-weight:900;font-size:0.85rem;}
.quiz-title-bar{font-size:0.85rem;font-weight:900;margin-bottom:10px;color:#555;}
.progress-bar{width:100%;height:10px;background:#e0e0e0;border:2px solid #000;border-radius:10px;overflow:hidden;margin-bottom:14px;}
.progress-fill{height:100%;background:var(--cyan);width:0%;transition:width .3s;border-radius:8px;}
.question-box{background:var(--white);border:var(--border);box-shadow:var(--shadow);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.question-num{font-size:0.72rem;font-weight:900;text-transform:uppercase;color:#888;margin-bottom:8px;}
.question-text{font-size:1rem;font-weight:800;line-height:1.5;}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.option-btn{padding:14px 10px;background:var(--white);border:var(--border);box-shadow:var(--shadow-sm);border-radius:14px;font-family:'Outfit',sans-serif;font-weight:800;font-size:0.88rem;cursor:pointer;text-align:center;transition:transform .1s,box-shadow .1s;}
.option-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
.option-btn.correct{background:var(--green);border-color:var(--green);}
.option-btn.wrong{background:var(--pink);border-color:var(--pink);}
.timer-bar{width:100%;height:8px;background:#e0e0e0;border:2px solid #000;border-radius:8px;overflow:hidden;margin-bottom:14px;}
.timer-fill{height:100%;background:var(--red);border-radius:6px;transition:width .1s linear;}

/* RESULT */
#resultScreen{display:none;}
.result-card{background:var(--white);border:var(--border);box-shadow:var(--shadow);border-radius:var(--radius);padding:28px 20px;text-align:center;margin-bottom:16px;}
.result-emoji{font-size:3.5rem;margin-bottom:10px;}
.result-title{font-size:1.6rem;font-weight:900;margin-bottom:8px;}
.result-coins{font-size:2rem;font-weight:900;color:var(--green);margin-bottom:16px;}
.result-usd{font-size:1rem;font-weight:700;color:#888;margin-bottom:20px;}

/* BUTTONS */
.btn{border:var(--border);box-shadow:var(--shadow);border-radius:12px;padding:13px 20px;font-family:'Outfit',sans-serif;font-weight:900;font-size:1rem;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,box-shadow .1s;width:100%;color:var(--dark);margin-bottom:10px;}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000;}
.btn-gold{background:var(--gold);}
.btn-cyan{background:var(--cyan);}
.btn-green{background:var(--green);}
.btn-red{background:var(--red);color:#fff;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:var(--white);border-top:var(--border);display:flex;align-items:stretch;box-shadow:0 -3px 0 #000;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;gap:3px;cursor:pointer;border:none;background:transparent;font-family:'Outfit',sans-serif;color:#888;font-size:0.6rem;font-weight:800;text-transform:uppercase;text-decoration:none;border-right:2px solid #000;position:relative;}
.nav-item:last-child{border-right:none;}
.nav-item i{font-size:20px;}
.nav-item.active{background:var(--gold);color:var(--dark);}
.nav-item:active{background:var(--gold);}

/* EMPTY STATE */
.empty-state{text-align:center;padding:40px 20px;color:#888;}
.empty-state .emoji{font-size:3rem;margin-bottom:12px;}
.empty-state p{font-weight:700;font-size:0.9rem;}
/* AD BANNER SLOT */
.ad-banner-slot{width:100%;background:rgba(0,0,0,0.03);border:2px dashed #ccc;border-radius:var(--radius);margin:14px 0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;}
.ad-banner-inline{width:100%;margin:14px 0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
</style>
</head>
<body>

<header>
  <div class="app-logo">⚡ CASH<span class="accent">TITAN</span></div>
  <div class="coins-chip">⭐ <span id="userCoins">0</span> coins</div>
</header>

<div id="listScreen">
  <div class="page-title">🧠 Quiz Arena</div>
  <!-- AD BANNER #1 — Quiz list ke upar -->
  <div class="ad-banner-slot"><span>Advertisement</span></div>
  <input class="quiz-search" type="text" placeholder="🔍 Search quizzes..." oninput="filterQuizzes(this.value)">
  <div class="quiz-count" id="quizCount"></div>
  <div id="quizList"></div>
  <button id="loadMoreBtn" class="load-more-btn" style="display:none" onclick="loadMore()">Load More Quizzes ↓</button>
  <!-- AD BANNER #2 — Quiz list ke neeche -->
  <div class="ad-banner-slot"><span>Advertisement</span></div>
</div>

<div id="gameScreen">
  <div class="game-header">
    <button class="back-btn" onclick="backToList()"><i class="fas fa-arrow-left"></i> Back</button>
    <div class="q-pts" id="gamePts">0 pts</div>
    <div class="q-usd" id="gameUsd">$0.000</div>
  </div>
  <div class="quiz-title-bar" id="gameTitleBar"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
  <div class="question-box">
    <div class="question-num" id="questionNum">Question 1 / 8</div>
    <div class="question-text" id="questionText">Loading...</div>
  </div>
  <div class="options-grid" id="optionsGrid"></div>
</div>

<div id="resultScreen"></div>

<nav class="bottom-nav">
  <a class="nav-item" href="dashboard.html"><i class="fas fa-home"></i>HOME</a>
  <a class="nav-item active" href="quiz.html"><i class="fas fa-brain"></i>QUIZ</a>
  <a class="nav-item" href="tasks.html"><i class="fas fa-tasks"></i>TASKS</a>
  <a class="nav-item" href="spin.html"><i class="fas fa-sync-alt"></i>SPIN</a>
  <a class="nav-item" href="refer.html"><i class="fas fa-user-plus"></i>REFER</a>
  <a class="nav-item" href="withdrawals.html"><i class="fas fa-wallet"></i>CASH</a>
</nav>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram?.WebApp;
if(tg?.expand) tg.expand();

let user = tg?.initDataUnsafe?.user || { id: localStorage.getItem("cz_uid") || 0 };
let allQuizzes = [], currentQuiz = null, qIndex = 1, score = 0, displayCount = 10;

// Heartbeat
function heartbeat() {
  if(user?.id) fetch("/api/heartbeat", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ telegram_id: user.id }) }).catch(()=>{});
}
heartbeat();
setInterval(heartbeat, 45000);

// Load user balance
async function loadBalance() {
  try {
    const res = await fetch(`/api/user_balance/${user.id}`);
    const data = await res.json();
    if(data.success) document.getElementById("userCoins").textContent = data.user.points || 0;
  } catch(e) {}
}
loadBalance();

// Load quiz list
async function loadQuizList() {
  const listEl = document.getElementById("quizList");
  listEl.innerHTML = `<div class="empty-state"><div class="emoji">⏳</div><p>Loading quizzes...</p></div>`;
  try {
    const res = await fetch(`/api/quizzes/${user.id}`);
    const data = await res.json();
    if(!data.success || !data.quizzes?.length) {
      listEl.innerHTML = `<div class="empty-state"><div class="emoji">🎉</div><p>No new quizzes right now.<br>Check back later!</p></div>`;
      document.getElementById("quizCount").textContent = "";
      return;
    }
    allQuizzes = data.quizzes;
    renderList();
  } catch(e) {
    listEl.innerHTML = `<div class="empty-state"><div class="emoji">❌</div><p>Error loading quizzes. Try again.</p></div>`;
  }
}

const ICONS = ["🧠","⚡","🌍","🎬","🏆","🔬","🎯","📚","🎮","💡","🌟","🔥"];

function renderList() {
  const listEl = document.getElementById("quizList");
  const btn = document.getElementById("loadMoreBtn");
  const visible = allQuizzes.slice(0, displayCount);
  document.getElementById("quizCount").textContent = `${allQuizzes.length} quizzes available`;
  listEl.innerHTML = "";
  visible.forEach((q, i) => {
    const usd = (q.total_points / 1000).toFixed(3);
    const icon = ICONS[i % ICONS.length];
    const div = document.createElement("div");
    div.className = "quiz-card";
    div.innerHTML = `
      <div class="quiz-card-header">
        <div class="quiz-icon">${icon}</div>
        <div>
          <div class="quiz-title">${q.title}</div>
          <div class="quiz-meta"><i class="fas fa-brain"></i> 8 Questions · <i class="fas fa-clock"></i> ~2 min</div>
        </div>
      </div>
      <div class="quiz-card-footer">
        <div class="quiz-reward">⭐ ${q.total_points} pts · $${usd}</div>
        <button class="quiz-play-btn" onclick="event.stopPropagation(); startQuiz(${q.id})">▶ PLAY</button>
      </div>`;
    div.onclick = () => startQuiz(q.id);
    listEl.appendChild(div);
    // AD BANNER INLINE — har 2 cards ke baad (320x50)
    if((i+1)%2===0){
      const adDiv=document.createElement("div");
      adDiv.className="ad-banner-inline";
      listEl.appendChild(adDiv);
      // Script 1: atOptions config
      const adConfig=document.createElement("script");
      adConfig.text=`atOptions={'key':'deb792f8ee417a018a36467ba888e920','format':'iframe','height':50,'width':320,'params':{}};`;
      adDiv.appendChild(adConfig);
      // Script 2: invoke.js
      const adScript=document.createElement("script");
      adScript.src="https://www.highperformanceformat.com/deb792f8ee417a018a36467ba888e920/invoke.js";
      adDiv.appendChild(adScript);
    }
  });
  btn.style.display = allQuizzes.length > displayCount ? "block" : "none";
}

function loadMore() { displayCount += 10; renderList(); }

function filterQuizzes(val) {
  const q = val.toLowerCase();
  const filtered = allQuizzes.filter(x => x.title.toLowerCase().includes(q));
  const listEl = document.getElementById("quizList");
  listEl.innerHTML = "";
  if(!filtered.length) { listEl.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><p>No quizzes found.</p></div>`; return; }
  filtered.forEach((q, i) => {
    const usd = (q.total_points / 1000).toFixed(3);
    const icon = ICONS[i % ICONS.length];
    const div = document.createElement("div");
    div.className = "quiz-card";
    div.innerHTML = `
      <div class="quiz-card-header">
        <div class="quiz-icon">${icon}</div>
        <div>
          <div class="quiz-title">${q.title}</div>
          <div class="quiz-meta"><i class="fas fa-brain"></i> 8 Questions · <i class="fas fa-clock"></i> ~2 min</div>
        </div>
      </div>
      <div class="quiz-card-footer">
        <div class="quiz-reward">⭐ ${q.total_points} pts · $${usd}</div>
        <button class="quiz-play-btn" onclick="event.stopPropagation(); startQuiz(${q.id})">▶ PLAY</button>
      </div>`;
    div.onclick = () => startQuiz(q.id);
    listEl.appendChild(div);
  });
}

// MONETAG — Rewarded Ad Helper
function showMonetagAd(callback){
  if(typeof show_11094140==='function'){
    show_11094140().then(()=>{if(callback)callback();}).catch(()=>{if(callback)callback();});
  } else { if(callback)callback(); }
}
// MONETAG — Auto Interstitial har 30 sec
setInterval(()=>{ showMonetagAd(); }, 30000);

// MONETAG — Rewarded Interstitial (Quiz start)
function showRewardedInterstitial(callback){
  if(typeof show_11094140==='function'){
    show_11094140().then(()=>{if(callback)callback();}).catch(()=>{if(callback)callback();});
  } else { if(callback)callback(); }
}

// Start quiz — Rewarded Pop Ad pehle, phir quiz shuru
async function startQuiz(id) {
  showRewardedInterstitial(async () => {
  if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  document.getElementById("listScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  document.getElementById("resultScreen").style.display = "none";
  try {
    const res = await fetch(`/api/quiz/${id}`);
    const data = await res.json();
    if(data.success && data.quiz) {
      currentQuiz = data.quiz;
      qIndex = 1; score = 0;
      document.getElementById("gameTitleBar").textContent = currentQuiz.title;
      document.getElementById("gamePts").textContent = `${currentQuiz.total_points} pts`;
      document.getElementById("gameUsd").textContent = `$${(currentQuiz.total_points/1000).toFixed(3)}`;
      renderQuestion();
    } else { backToList(); }
  } catch(e) { backToList(); }
  }); // end showRewardedInterstitial
}

function backToList() {
  document.getElementById("listScreen").style.display = "block";
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "none";
}

function renderQuestion() {
  const qData = currentQuiz[`question${qIndex}`];
  if(!qData) { finishQuiz(); return; }
  document.getElementById("questionNum").textContent = `Question ${qIndex} / 8`;
  document.getElementById("questionText").textContent = qData;
  document.getElementById("progressBar").style.width = `${((qIndex-1)/8)*100}%`;
  const grid = document.getElementById("optionsGrid");
  grid.innerHTML = "";
  ['a','b','c','d'].forEach(opt => {
    const text = currentQuiz[`option${qIndex}${opt}`];
    if(text) {
      const btn = document.createElement("div");
      btn.className = "option-btn";
      btn.innerHTML = `<span style="opacity:0.5;font-weight:800;width:20px;">${opt.toUpperCase()}</span> ${text}`;
      btn.onclick = () => handleAnswer(btn, text);
      grid.appendChild(btn);
    }
  });
}

function handleAnswer(btn, selected) {
  document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = "none");
  const correct = currentQuiz[`correct${qIndex}`];
  const isCorrect = selected.trim().toLowerCase() === correct?.trim().toLowerCase();
  if(isCorrect) {
    btn.classList.add("correct");
    score++;
    if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } else {
    btn.classList.add("wrong");
    // Highlight correct
    document.querySelectorAll('.option-btn').forEach(b => {
      if(b.textContent.includes(correct?.trim())) b.classList.add("correct");
    });
    if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
  }
  setTimeout(() => { qIndex++; renderQuestion(); }, 1000);
}

async function finishQuiz() {
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "block";
  const total = 8;
  const isWin = score === total;
  const usd = (currentQuiz.total_points / 1000).toFixed(3);
  const resultEl = document.getElementById("resultScreen");

  if(isWin) {
    if(typeof confetti === "function") confetti({ particleCount:200, spread:80, origin:{y:0.6} });
    try {
      await fetch("/api/add_points", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ telegram_id:user.id, points:currentQuiz.total_points }) });
      await fetch("/api/submit_quiz", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ telegram_id:user.id, quiz_id:currentQuiz.id, score }) });
      document.getElementById("userCoins").textContent = parseInt(document.getElementById("userCoins").textContent||0) + currentQuiz.total_points;
    } catch(e) {}
    resultEl.innerHTML = `
      <div class="result-card">
        <div class="result-emoji">🏆</div>
        <div class="result-title" style="color:var(--green)">Perfect Score!</div>
        <div class="result-coins">+${currentQuiz.total_points} coins</div>
        <div class="result-usd">+$${usd} USD earned</div>
        <button class="btn btn-gold" onclick="location.reload()"><i class="fas fa-arrow-right"></i> Next Quiz</button>
        <button class="btn btn-cyan" onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i> Go Home</button>
      </div>`;
  } else {
    try { fetch("/api/fail_quiz", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ telegram_id:user.id }) }); } catch(e) {}
    resultEl.innerHTML = `
      <div class="result-card">
        <div class="result-emoji">😅</div>
        <div class="result-title" style="color:var(--red)">Quiz Failed</div>
        <div style="font-size:0.95rem;font-weight:700;color:#888;margin-bottom:20px">You scored ${score}/8 — Need all 8 correct to earn!</div>
        <button class="btn btn-red" onclick="retryQuiz()"><i class="fas fa-redo"></i> Try Again</button>
        <button class="btn btn-cyan" onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i> Go Home</button>
      </div>`;
  }
}

function retryQuiz() {
  qIndex = 1; score = 0;
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  renderQuestion();
}

loadQuizList();
</script>
</body>
</html>
