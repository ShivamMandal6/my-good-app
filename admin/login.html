<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CashTitan Admin — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin_style.css">
<style>
body { background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.login-wrap { width: 100%; max-width: 420px; }
.login-logo { text-align: center; margin-bottom: 24px; }
.login-logo .logo-text { font-size: 2rem; font-weight: 900; background: var(--gold); border: var(--border); box-shadow: var(--shadow); padding: 10px 28px; border-radius: 16px; display: inline-block; }
.login-logo .logo-text span { color: #ff3860; }
.login-logo p { font-size: 0.85rem; font-weight: 700; color: #888; margin-top: 8px; }
.login-card { background: var(--white); border: var(--border); box-shadow: var(--shadow); border-radius: 20px; padding: 28px 24px; }
.login-card h2 { font-size: 1.3rem; font-weight: 900; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.78rem; font-weight: 900; text-transform: uppercase; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 12px 14px; border: var(--border); border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 700; background: var(--bg); outline: none; }
.form-group input:focus { border-color: var(--cyan); background: #fff; }
.login-btn { width: 100%; padding: 14px; background: var(--gold); border: var(--border); box-shadow: var(--shadow); border-radius: 14px; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1rem; cursor: pointer; text-transform: uppercase; transition: transform 0.1s, box-shadow 0.1s; }
.login-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #000; }
.error-msg { background: #ffe0e0; border: 2px solid #ff4444; border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; font-weight: 700; color: #cc0000; margin-bottom: 14px; display: none; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-text">CASH<span>ZILLA</span></div>
    <p>Admin Command Center</p>
  </div>
  <div class="login-card">
    <h2>🔐 Admin Login</h2>
    <div class="error-msg" id="errorMsg">Invalid username or password.</div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter admin username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="doLogin()">🚀 Login to Admin Panel</button>
  </div>
</div>

<script>
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';
  if (!username || !password) { errEl.textContent = 'Please fill all fields.'; errEl.style.display = 'block'; return; }
  try {
    const res = await fetch('/admin/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('adminToken', data.token);
      window.location.href = 'dashboard.html';
    } else {
      errEl.textContent = 'Invalid username or password.';
      errEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = 'Connection error. Try again.';
    errEl.style.display = 'block';
  }
}
document.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
// Redirect if already logged in
if(localStorage.getItem('adminToken')) window.location.href = 'dashboard.html';
</script>
</body>
</html>
