<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Wheel | CashZilla Admin</title>
<link rel="stylesheet" href="admin_style.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><div style="width:32px;height:32px;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">🦕</div><div><div style="font-size:0.95rem;font-weight:900;">CASH<span style="color:#ff3860;">ZILLA</span></div><div style="font-size:0.62rem;font-weight:800;color:#555;text-transform:uppercase;">Admin Panel</div></div></div>
  <ul class="nav-menu">
    <li class="nav-item"><a href="dashboard.html"  class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a></li>
    <li class="nav-item"><a href="user.html"        class="nav-link"><i class="fas fa-users"></i> Users</a></li>
    <li class="nav-item"><a href="quiz.html"        class="nav-link"><i class="fas fa-brain"></i> Quizzes</a></li>
    <li class="nav-item"><a href="tasks.html"       class="nav-link"><i class="fas fa-tasks"></i> Tasks</a></li>
    <li class="nav-item"><a href="spin.html"        class="nav-link active"><i class="fas fa-sync-alt"></i> Spin Wheel</a></li>
    <li class="nav-item"><a href="referrals.html"   class="nav-link"><i class="fas fa-user-friends"></i> Referrals</a></li>
    <li class="nav-item"><a href="withdrawals.html" class="nav-link"><i class="fas fa-wallet"></i> Withdrawals</a></li>
    <li class="nav-item"><a href="ads.html"         class="nav-link"><i class="fas fa-ad"></i> Ads Manager</a></li>
    <li class="nav-item" style="margin-top:16px;"><a href="#" class="nav-link nav-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
  </ul>
</div>
<div class="main-content">
  <div class="header-section"><h2><i class="fas fa-sync-alt"></i> Spin Wheel</h2><button class="btn-action" style="background:var(--gold);" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button></div>
  <p class="page-subtitle">Manage spin wheel rewards and view spin history</p>
  <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:20px;">
    <div class="stat-card" style="background:var(--gold);"><i class="fas fa-dharmachakra"></i><h2 id="sTotalSpins">—</h2><span>Total Spins</span></div>
    <div class="stat-card" style="background:var(--cyan);"><i class="fas fa-coins"></i><h2 id="sTotalCoins">—</h2><span>Coins Given</span></div>
    <div class="stat-card" style="background:var(--green);"><i class="fas fa-calendar-day"></i><h2 id="sTodaySpins">—</h2><span>Today Spins</span></div>
  </div>
  <div class="content-box">
    <h3><i class="fas fa-history"></i> Recent Spin History</h3>
    <div class="table-wrap" style="margin-top:14px;">
      <table>
        <thead><tr><th>#</th><th>User</th><th>Reward</th><th>Date</th></tr></thead>
        <tbody id="spinTable"><tr><td colspan="4" style="text-align:center;padding:24px;color:#888;font-weight:700">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<div class="admin-toast" id="toast"></div>
<script>
function logout(){localStorage.removeItem("adminToken");window.location.href="index.html";}
if(!localStorage.getItem("adminToken"))window.location.href="index.html";
const TOKEN=localStorage.getItem("adminToken");
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}
async function loadData(){
  try{
    const r=await fetch("/admin/api/spin/history",{headers:{"Authorization":"Bearer "+TOKEN}});
    const d=await r.json();
    document.getElementById("sTotalSpins").textContent=d.total_spins||0;
    document.getElementById("sTotalCoins").textContent=d.total_coins||0;
    document.getElementById("sTodaySpins").textContent=d.today_spins||0;
    const tb=document.getElementById("spinTable");
    const items=d.history||[];
    if(!items.length){tb.innerHTML='<tr><td colspan="4" style="text-align:center;padding:24px;color:#888;font-weight:700">No spins yet</td></tr>';return;}
    tb.innerHTML=items.map((s,i)=>`<tr><td style="font-weight:900">${i+1}</td><td style="font-weight:800">${s.user_name||"User #"+s.user_id}</td><td><span class="badge ${s.reward_amount>0?'badge-green':'badge-orange'}">${s.reward_amount>0?'+'+s.reward_amount+' coins':'No reward'}</span></td><td style="font-size:0.78rem;color:#888">${new Date(s.created_at).toLocaleString()}</td></tr>`).join('');
  }catch(e){document.getElementById("spinTable").innerHTML='<tr><td colspan="4" style="text-align:center;padding:24px;color:#888;font-weight:700">Connect API to see data</td></tr>';}
}
loadData();
</script>
</body>
</html>
